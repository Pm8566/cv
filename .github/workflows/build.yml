name: Build and ATS-test CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install LibreOffice + poppler (for the PDF and page-count check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer poppler-utils >/dev/null

      # Phone and email live only in repo secrets. The built file is NOT uploaded as an
      # artifact, because artifacts on a public repo can be downloaded by anyone.
      - name: Build CV
        env:
          CV_PHONE: ${{ secrets.CV_PHONE }}
          CV_EMAIL: ${{ secrets.CV_EMAIL }}
        run: npm run build

      - name: ATS test
        run: npm run ats -- --require-contact

      - name: Generated files are up to date
        run: git diff --exit-code SKILLS.md BUILD-NEXT.md
