# Evidence ledger: one entry per CV claim.
# The CV only shows entries with status: on_cv. Everything else is listed in BUILD-NEXT.md.
#
# Fields
#   id            short unique name
#   section       experience | skills | projects | qualifications
#   role          (experience only) which role in cv.yaml the bullet belongs to
#   skills        tags this claim is evidence for (used to count evidence per skill)
#   claim_text    the exact wording that appears on the CV
#   proof_type    github | cert | reference | work_artifact | live_test | course_record
#   proof_url     link to the proof (blank if there is no public link yet)
#   date_verified when Paul last confirmed the claim is true (YYYY-MM-DD)
#   status        on_cv | pending_proof | removed
#   note          (optional) why it's pending / what's needed
#
# Rule: Paul must be able to answer interview questions about every on_cv claim.
# New entries are appended at the bottom by the n8n "Add to my CV" form.

